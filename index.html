<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixelbilder</title>
  <style>
    :root {
      --rastergroesse: 19;       /* Anzahl Felder pro Zeile/Spalte (wird per JavaScript gesetzt) */
      /* Grösse eines Feldes: höchstens 28px, sonst so gross, dass das Raster
         zwischen die Seitenleisten und auf die Bildschirmhöhe passt */
      --feldgroesse: min(28px,
                         calc((100vw - 440px) / var(--rastergroesse) - 1px),
                         calc((100vh - 90px) / var(--rastergroesse) - 1px));
      --linienfarbe: #bdbdbd;
      --leer: #e9e9e9;           /* Farbe der leeren (ungemalten) Felder */
      --hintergrund: #f4f4f4;
    }

    body {
      margin: 0;
      padding: 12px 16px;
      font-family: system-ui, sans-serif;
      background: var(--hintergrund);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 12px;
    }

    h2 {
      font-size: 1rem;
      margin: 0 0 4px;
      color: #555;
    }

    /* ---------- Aufbau: Farben links, Raster Mitte, Werkzeuge rechts ---------- */
    #arbeitsflaeche {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 24px;
    }

    .leiste {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
    }

    #rechts { width: 170px; }

    /* ---------- Farben ---------- */
    #palette {
      display: grid;
      grid-template-columns: repeat(3, 32px);
      gap: 8px;
    }

    .farbe {
      width: 32px;
      height: 32px;
      border: 2px solid #888;
      border-radius: 6px;
      cursor: pointer;
      padding: 0;
    }

    .farbe.aktiv, #eigeneFarbe.aktiv {
      outline: 3px solid #4a90e2;
      outline-offset: 2px;
    }

    .eigene {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    #eigeneFarbe {
      width: 36px;
      height: 36px;
      border: none;
      background: none;
      cursor: pointer;
      padding: 0;
    }

    /* ---------- Werkzeuge ---------- */
    button.text {
      padding: 7px 10px;
      font-size: 0.95rem;
      border: 1px solid #888;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      text-align: left;
    }

    button.text:hover { background: #eaeaea; }

    button.text:disabled {
      opacity: 0.4;
      cursor: default;
      background: #fff;
    }

    .werkzeugwahl .breit { grid-column: span 2; }

    /* Zeichenwerkzeuge: Stift und Formen */
    .werkzeugwahl {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .werkzeugwahl button.text { padding: 7px 6px; }

    .werkzeug.aktiv {
      outline: 3px solid #4a90e2;
      outline-offset: 1px;
      background: #e8f1fc;
    }

    .hinweis {
      font-size: 0.8rem;
      color: #666;
      margin: 0;
    }

    label { font-size: 0.95rem; cursor: pointer; }

    select {
      font-size: 0.95rem;
      padding: 4px 6px;
      border: 1px solid #888;
      border-radius: 6px;
      background: #fff;
      width: 100%;
    }

    hr {
      border: none;
      border-top: 1px solid #ddd;
      margin: 2px 0;
      width: 100%;
    }

    /* ---------- Raster ---------- */
    #raster {
      display: grid;
      grid-template-columns: repeat(var(--rastergroesse), var(--feldgroesse));
      grid-template-rows: repeat(var(--rastergroesse), var(--feldgroesse));
      gap: 1px;
      background: var(--linienfarbe);   /* bildet die Rasterlinien */
      border: 1px solid var(--linienfarbe);
      touch-action: none;               /* Malen mit Finger ohne Scrollen */
      user-select: none;
      cursor: crosshair;
      flex-shrink: 0;
    }

    .feld {
      background: var(--leer);
    }

    .feld:hover {
      outline: 2px solid #4a90e2;
      outline-offset: -2px;
    }

    /* Hilfslinien: mittlere Zeile und Spalte leicht markieren */
    #raster.mitte .feld.mittellinie {
      box-shadow: inset 0 0 0 100px rgba(74, 144, 226, 0.18);
    }

    /* ---------- Schmale Bildschirme (Handy, iPad hochkant): untereinander ---------- */
    @media (max-width: 860px) {
      :root {
        --feldgroesse: min(28px, calc((100vw - 40px) / var(--rastergroesse) - 1px));
      }
      #arbeitsflaeche {
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      #palette { grid-template-columns: repeat(7, 32px); }
      .leiste { align-items: center; }
      #rechts {
        width: auto;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
      }
      #rechts h2, #rechts hr, .hinweis { display: none; }
      .werkzeugwahl { grid-template-columns: repeat(4, auto); }
      .werkzeugwahl .breit { grid-column: auto; }
      select { width: auto; }
    }
  </style>
</head>
<body>
  <h1>Pixelbilder</h1>

  <div id="arbeitsflaeche">

    <!-- Links: Farben -->
    <aside class="leiste" id="links">
      <h2>Farben</h2>
      <div id="palette"><!-- Farbknöpfe werden per JavaScript erzeugt --></div>
      <label class="eigene" title="Eigene Farbe wählen">
        <input type="color" id="eigeneFarbe" value="#8a2be2"> eigene Farbe
      </label>
    </aside>

    <!-- Mitte: Raster -->
    <div id="raster"></div>

    <!-- Rechts: Werkzeuge -->
    <aside class="leiste" id="rechts">
      <h2>Zeichnen</h2>
      <div class="werkzeugwahl">
        <button class="text werkzeug aktiv breit" data-form="stift" title="Feld für Feld malen">✏️ Stift</button>
        <button class="text werkzeug" data-form="kreis" title="Kreis zeichnen">⭕ Kreis</button>
        <button class="text werkzeug" data-form="herz" title="Herz zeichnen">❤️ Herz</button>
        <button class="text werkzeug breit" data-form="radierer" title="Felder wieder leer machen">🧽 Radiergummi</button>
      </div>
      <label><input type="checkbox" id="ausgefuellt"> Form ausfüllen</label>
      <p class="hinweis">Formen: von einer Ecke zur gegenüberliegenden ziehen.</p>
      <hr>
      <button class="text" id="zurueck" title="Letzten Schritt rückgängig machen (Strg + Z)" disabled>↩️ Zurück</button>
      <button class="text" id="loeschen">🗑️ Alles löschen</button>
      <hr>
      <h2>Raster</h2>
      <select id="groesseWahl" title="Rastergrösse">
        <option value="15">15 × 15</option>
        <option value="19" selected>19 × 19</option>
        <option value="25">25 × 25</option>
        <option value="31">31 × 31</option>
      </select>
      <label><input type="checkbox" id="mitteAnzeigen"> Mitte anzeigen</label>
      <hr>
      <h2>Speichern</h2>
      <button class="text" id="exportieren">💾 Als PNG speichern</button>
      <label><input type="checkbox" id="linienExport"> mit Rasterlinien</label>
      <label><input type="checkbox" id="farblisteExport" checked> mit Farbliste</label>
    </aside>

  </div>

  <script>
    let groesse = 19;                         // Anzahl Felder pro Zeile/Spalte

    // 21 Malfarben (inkl. Weiss – leere Felder sind hellgrau)
    const FARBEN = [
      { wert: '#000000', name: 'Schwarz' },
      { wert: '#ffffff', name: 'Weiss' },
      { wert: '#8a8a8a', name: 'Grau' },
      { wert: '#8d5524', name: 'Braun' },
      { wert: '#f1c27d', name: 'Hautfarbe' },
      { wert: '#9b2226', name: 'Dunkelrot' },
      { wert: '#e63946', name: 'Rot' },
      { wert: '#ff8fab', name: 'Rosa' },
      { wert: '#d63384', name: 'Pink' },
      { wert: '#f77f00', name: 'Orange' },
      { wert: '#ffd60a', name: 'Gelb' },
      { wert: '#fff3a3', name: 'Hellgelb' },
      { wert: '#80ed99', name: 'Hellgrün' },
      { wert: '#38b000', name: 'Grün' },
      { wert: '#1b5e20', name: 'Dunkelgrün' },
      { wert: '#2ec4b6', name: 'Türkis' },
      { wert: '#74c0fc', name: 'Hellblau' },
      { wert: '#1d4ed8', name: 'Blau' },
      { wert: '#1e2a78', name: 'Dunkelblau' },
      { wert: '#7b2cbf', name: 'Violett' },
      { wert: '#c8a2ff', name: 'Flieder' },
    ];

    let aktuelleFarbe = FARBEN[0].wert;
    let maltGerade = false;

    const raster = document.getElementById('raster');
    const palette = document.getElementById('palette');
    const eigeneFarbe = document.getElementById('eigeneFarbe');

    // ---------- Farbpalette ----------
    function farbeWaehlen(wert, knopf) {
      aktuelleFarbe = wert;
      document.querySelectorAll('.farbe, #eigeneFarbe').forEach(k => k.classList.remove('aktiv'));
      if (knopf) knopf.classList.add('aktiv');
      // Wer eine Farbe wählt, will malen: Radiergummi ausschalten, Stift nehmen
      if (form === 'radierer') werkzeugWaehlen('stift');
    }

    FARBEN.forEach((f, i) => {
      const knopf = document.createElement('button');
      knopf.className = 'farbe' + (i === 0 ? ' aktiv' : '');
      knopf.style.background = f.wert;
      knopf.title = f.name;
      knopf.addEventListener('click', () => farbeWaehlen(f.wert, knopf));
      palette.appendChild(knopf);
    });

    eigeneFarbe.addEventListener('input', () => farbeWaehlen(eigeneFarbe.value, eigeneFarbe));

    // ---------- Raster erzeugen (z.B. 19 x 19 = 361 Felder) ----------
    function rasterAufbauen(n) {
      groesse = n;
      const mitte = Math.floor(n / 2);   // bei 19 = 9 (die 10. Zeile/Spalte)
      document.documentElement.style.setProperty('--rastergroesse', n);
      raster.innerHTML = '';
      for (let zeile = 0; zeile < n; zeile++) {
        for (let spalte = 0; spalte < n; spalte++) {
          const feld = document.createElement('div');
          feld.className = 'feld';
          if (zeile === mitte || spalte === mitte) feld.classList.add('mittellinie');
          feld.dataset.zeile = zeile;
          feld.dataset.spalte = spalte;
          feld.title = `Zeile ${zeile + 1}, Spalte ${spalte + 1}`;
          raster.appendChild(feld);
        }
      }
    }

    // ---------- Bild beim Ändern der Rastergrösse anpassen ----------
    // Farbe eines Feldes lesen (null = leer)
    function farbeVon(feld) {
      return feld.style.backgroundColor || null;
    }

    // Aktuelles Bild als Liste von Farben speichern
    function bildLesen() {
      return { n: groesse, farben: [...raster.children].map(farbeVon) };
    }

    // Bild von alter auf neue Grösse umrechnen:
    // Jedes neue Feld schaut, welche alten Felder es überdeckt (und wie stark).
    // Ist mindestens 30 % davon bemalt, bekommt es die häufigste Farbe, sonst bleibt es leer.
    function bildSkalieren(alt, n) {
      const N = alt.n;
      const faktor = N / n;
      const neu = [];
      for (let z = 0; z < n; z++) {
        for (let s = 0; s < n; s++) {
          const y0 = z * faktor, y1 = (z + 1) * faktor;
          const x0 = s * faktor, x1 = (s + 1) * faktor;
          const anteile = {};
          let bemalt = 0;
          for (let az = Math.floor(y0); az < Math.min(N, Math.ceil(y1)); az++) {
            const h = Math.min(y1, az + 1) - Math.max(y0, az);
            for (let as = Math.floor(x0); as < Math.min(N, Math.ceil(x1)); as++) {
              const w = Math.min(x1, as + 1) - Math.max(x0, as);
              const c = alt.farben[az * N + as];
              if (c) {
                anteile[c] = (anteile[c] || 0) + w * h;
                bemalt += w * h;
              }
            }
          }
          let beste = null, max = 0;
          for (const c in anteile) {
            if (anteile[c] > max) { max = anteile[c]; beste = c; }
          }
          neu.push(bemalt >= 0.3 * faktor * faktor ? beste : null);
        }
      }
      return neu;
    }

    // Das Bild, von dem aus umgerechnet wird. Solange nicht weitergemalt wird,
    // wird immer vom Original aus umgerechnet: 31 → 19 → 31 ergibt wieder das Originalbild.
    let vorlage = null;
    let geaendert = false;   // wurde seit dem letzten Umrechnen gemalt?

    const groesseWahl = document.getElementById('groesseWahl');
    groesseWahl.addEventListener('change', () => {
      schrittMerken(bildLesen());
      const neu = Number(groesseWahl.value);
      if (geaendert || !vorlage) vorlage = bildLesen();
      rasterAufbauen(neu);
      const farben = bildSkalieren(vorlage, neu);
      [...raster.children].forEach((feld, i) => {
        if (farben[i]) feld.style.background = farben[i];
      });
      geaendert = false;
    });

    rasterAufbauen(groesse);

    // ---------- Malen (Klicken oder mit gedrückter Maus/Finger ziehen) ----------
    function malen(feld) {
      if (feld && feld.classList.contains('feld')) {
        feld.style.background = form === 'radierer' ? '' : aktuelleFarbe;   // '' = leer (hellgrau)
        geaendert = true;
      }
    }

    // ---------- Formen: Kreis, Herz ----------
    // Werkzeug: 'stift', 'radierer', 'kreis' oder 'herz'
    let form = 'stift';
    const ausgefuellt = document.getElementById('ausgefuellt');

    // Stift und Radiergummi malen Feld für Feld, die anderen Werkzeuge zeichnen Formen
    function istFreihand() {
      return form === 'stift' || form === 'radierer';
    }

    function werkzeugWaehlen(name) {
      form = name;
      document.querySelectorAll('.werkzeug').forEach(k => k.classList.toggle('aktiv', k.dataset.form === name));
    }

    document.querySelectorAll('.werkzeug').forEach(knopf => {
      knopf.addEventListener('click', () => werkzeugWaehlen(knopf.dataset.form));
    });

    // Punkte einer Form so umrechnen, dass sie genau ins Quadrat von -1 bis 1 passen
    function normalisieren(punkte) {
      const xs = punkte.map(p => p[0]), ys = punkte.map(p => p[1]);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minY = Math.min(...ys), maxY = Math.max(...ys);
      return punkte.map(([x, y]) => [
        (x - minX) / (maxX - minX) * 2 - 1,
        (y - minY) / (maxY - minY) * 2 - 1,
      ]);
    }

    // Herz: bekannte Herzkurve (y umgedreht, weil am Bildschirm y nach unten zählt)
    const HERZ = normalisieren(Array.from({ length: 120 }, (_, i) => {
      const t = i / 120 * 2 * Math.PI;
      return [
        16 * Math.sin(t) ** 3,
        -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)),
      ];
    }));

    // Liegt der Punkt (x, y) im Vieleck?
    function imVieleck(x, y, poly) {
      let drin = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const [xi, yi] = poly[i], [xj, yj] = poly[j];
        if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) drin = !drin;
      }
      return drin;
    }

    // Liegt der Punkt (u, v) – beide zwischen -1 und 1 – in der Form?
    function istInForm(art, u, v) {
      if (art === 'kreis') return u * u + v * v <= 1.0001;
      if (art === 'herz') return imVieleck(u, v, HERZ);
      return false;
    }

    // Welche Felder gehören zur Form? Die Form liegt immer in einem Quadrat
    // (damit der Kreis rund bleibt), aufgespannt vom Start- zum Endfeld.
    function formFelder(art, z0, s0, z1, s1, gefuellt) {
      const rz = z1 >= z0 ? 1 : -1;
      const rs = s1 >= s0 ? 1 : -1;
      let k = Math.max(Math.abs(z1 - z0), Math.abs(s1 - s0));
      k = Math.min(k, rz > 0 ? groesse - 1 - z0 : z0, rs > 0 ? groesse - 1 - s0 : s0);  // nicht über den Rand
      const n = k + 1;
      const zmin = Math.min(z0, z0 + rz * k);
      const smin = Math.min(s0, s0 + rs * k);

      // Ist die Mitte von Feld (i, j) in der Form?
      const drin = (i, j) => i >= 0 && j >= 0 && i < n && j < n &&
        istInForm(art, (j + 0.5) / n * 2 - 1, (i + 0.5) / n * 2 - 1);

      const felder = [];
      for (let i = 0; i < n; i++) {
        for (let j = 0; j < n; j++) {
          if (!drin(i, j)) continue;
          // Nur Umriss: Feld gehört dazu, wenn ein Nachbar ausserhalb der Form liegt
          const rand = !drin(i - 1, j) || !drin(i + 1, j) || !drin(i, j - 1) || !drin(i, j + 1);
          if (gefuellt || rand) felder.push([zmin + i, smin + j]);
        }
      }
      return felder;
    }

    let startFeld = null;        // wo das Ziehen der Form begonnen hat
    let schnappschuss = null;    // Bild vor dem Zeichnen der Form (für die Vorschau)

    function formZeichnen(endFeld) {
      const felder = raster.children;
      schnappschuss.forEach((farbe, i) => felder[i].style.background = farbe);   // Vorschau zurücksetzen
      formFelder(form,
        Number(startFeld.dataset.zeile), Number(startFeld.dataset.spalte),
        Number(endFeld.dataset.zeile), Number(endFeld.dataset.spalte),
        ausgefuellt.checked
      ).forEach(([z, s]) => felder[z * groesse + s].style.background = aktuelleFarbe);
      geaendert = true;
    }

    function feldUnterZeiger(e) {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      return el && el.classList.contains('feld') ? el : null;
    }

    raster.addEventListener('pointerdown', e => {
      raster.releasePointerCapture?.(e.pointerId);  // wichtig für Touch
      const feld = e.target.classList.contains('feld') ? e.target : null;
      if (!feld) return;
      maltGerade = true;
      bildVorher = bildLesen();   // für «Zurück»
      if (istFreihand()) {
        malen(feld);
      } else {
        startFeld = feld;
        schnappschuss = [...raster.children].map(f => f.style.background);
        formZeichnen(feld);
      }
    });

    raster.addEventListener('pointermove', e => {
      if (!maltGerade) return;
      const feld = feldUnterZeiger(e);
      if (istFreihand()) malen(feld);
      else if (feld && startFeld) formZeichnen(feld);
    });

    function malenBeenden() {
      // Hat sich durch den Strich / die Form etwas verändert? Dann als Schritt merken.
      if (bildVorher) {
        const jetzt = bildLesen();
        if (jetzt.farben.join('|') !== bildVorher.farben.join('|')) schrittMerken(bildVorher);
      }
      bildVorher = null;
      maltGerade = false;
      startFeld = null;
      schnappschuss = null;
    }

    // ---------- Zurück: die letzten 3 Schritte rückgängig machen ----------
    const MAX_SCHRITTE = 3;
    const verlauf = [];          // gespeicherte Bilder vor den letzten Schritten
    let bildVorher = null;       // Bild vor dem aktuellen Strich
    const zurueckKnopf = document.getElementById('zurueck');

    function schrittMerken(bild) {
      verlauf.push(bild);
      if (verlauf.length > MAX_SCHRITTE) verlauf.shift();   // ältesten Schritt vergessen
      zurueckKnopf.disabled = false;
    }

    function zurueck() {
      const bild = verlauf.pop();
      if (!bild) return;
      if (bild.n !== groesse) {          // Rastergrösse wurde geändert → zurückstellen
        rasterAufbauen(bild.n);
        groesseWahl.value = bild.n;
      }
      [...raster.children].forEach((feld, i) => feld.style.background = bild.farben[i] || '');
      geaendert = true;
      zurueckKnopf.disabled = verlauf.length === 0;
    }

    zurueckKnopf.addEventListener('click', zurueck);
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        zurueck();
      }
    });
    window.addEventListener('pointerup', malenBeenden);
    window.addEventListener('pointercancel', malenBeenden);

    // ---------- Buttons ----------
    document.getElementById('loeschen').addEventListener('click', () => {
      if (confirm('Wirklich das ganze Bild löschen?')) {
        schrittMerken(bildLesen());
        document.querySelectorAll('.feld').forEach(f => f.style.background = '');
        geaendert = true;
      }
    });

    // Name einer Farbe für die Farbliste ("rgb(230, 57, 70)" → "Rot")
    function hexZuRgb(hex) {
      const z = parseInt(hex.slice(1), 16);
      return `rgb(${(z >> 16) & 255}, ${(z >> 8) & 255}, ${z & 255})`;
    }
    function farbName(rgb) {
      const treffer = FARBEN.find(f => hexZuRgb(f.wert) === rgb);
      if (treffer) return treffer.name;
      const hex = '#' + rgb.match(/\d+/g).slice(0, 3)
        .map(n => Number(n).toString(16).padStart(2, '0')).join('');
      return `Eigene ${hex}`;
    }

    // ---------- Export als PNG (leere Felder werden durchsichtig) ----------
    document.getElementById('exportieren').addEventListener('click', () => {
      const PIXEL = 20;   // jedes Feld wird im Bild 20 x 20 Pixel gross
      const mitLinien = document.getElementById('linienExport').checked;
      const mitFarbliste = document.getElementById('farblisteExport').checked;

      // Gebrauchte Farben zählen (leere Felder zählen nicht)
      const zaehler = new Map();
      document.querySelectorAll('.feld').forEach(feld => {
        const farbe = farbeVon(feld);
        if (farbe) zaehler.set(farbe, (zaehler.get(farbe) || 0) + 1);
      });
      const liste = [...zaehler.entries()]
        .map(([farbe, anzahl]) => ({ farbe, anzahl, name: farbName(farbe) }))
        .sort((a, b) => b.anzahl - a.anzahl);
      const farblisteZeigen = mitFarbliste && liste.length > 0;

      // Grösse des Bildes: Pixelbild oben, Farbliste darunter
      const BILD = groesse * PIXEL;
      const SPALTE = 190, ZEILE = 30, RAND = 16, TITEL = 30;
      const breite = farblisteZeigen ? Math.max(BILD, 2 * SPALTE + 2 * RAND) : BILD;
      const spalten = Math.max(1, Math.floor((breite - 2 * RAND) / SPALTE));
      const zeilen = Math.ceil(liste.length / spalten);
      const listenHoehe = farblisteZeigen ? RAND + TITEL + zeilen * ZEILE + RAND : 0;

      const canvas = document.createElement('canvas');
      canvas.width = breite;
      canvas.height = BILD + listenHoehe;
      const ctx = canvas.getContext('2d');
      const bildX = Math.floor((breite - BILD) / 2);   // Bild mittig

      document.querySelectorAll('.feld').forEach(feld => {
        const x = bildX + feld.dataset.spalte * PIXEL;
        const y = feld.dataset.zeile * PIXEL;
        const farbe = farbeVon(feld);
        if (farbe) {
          ctx.fillStyle = farbe;
          ctx.fillRect(x, y, PIXEL, PIXEL);
        }
        if (mitLinien) {
          ctx.strokeStyle = '#c8c8c8';
          ctx.lineWidth = 1;
          ctx.strokeRect(x + 0.5, y + 0.5, PIXEL - 1, PIXEL - 1);
        }
      });

      // Farbliste: Farbfeld + Name + Anzahl Pixel
      if (farblisteZeigen) {
        const y0 = BILD;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, y0, breite, listenHoehe);
        ctx.fillStyle = '#222';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 15px system-ui, sans-serif';
        const gesamt = liste.reduce((summe, f) => summe + f.anzahl, 0);
        ctx.fillText(`Farben (${gesamt} Pixel gesamt)`, RAND, y0 + RAND + TITEL / 2 - 4);
        ctx.font = '14px system-ui, sans-serif';
        liste.forEach((f, i) => {
          const x = RAND + (i % spalten) * SPALTE;
          const y = y0 + RAND + TITEL + Math.floor(i / spalten) * ZEILE;
          ctx.fillStyle = f.farbe;
          ctx.fillRect(x, y + 3, 22, 22);
          ctx.strokeStyle = '#888';
          ctx.lineWidth = 1;
          ctx.strokeRect(x + 0.5, y + 3.5, 21, 21);
          ctx.fillStyle = '#222';
          ctx.fillText(`${f.name}: ${f.anzahl}`, x + 30, y + 14);
        });
      }

      // Bild als Datei herunterladen
      canvas.toBlob(blob => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'pixelbild.png';
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      }, 'image/png');
    });

    document.getElementById('mitteAnzeigen').addEventListener('change', e => {
      raster.classList.toggle('mitte', e.target.checked);
    });
  </script>
</body>
</html>
